<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10"><title>Captura Vertical — HDMI USB</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#f4f5fa}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#080a10}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:10px 14px;background:#151923;border-bottom:1px solid #303644;z-index:2}.brand{font-weight:700;margin-right:auto}button,select{border:1px solid #3d4658;border-radius:8px;padding:9px 11px;background:#252c39;color:white;font:inherit;max-width:100%}button{cursor:pointer}button:hover:not(:disabled){background:#354055}button:disabled{opacity:.55;cursor:wait}button:focus-visible,select:focus-visible{outline:2px solid #91a4ff;outline-offset:2px}.primary{background:#4a66ec;border-color:#4a66ec}.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;isolation:isolate}video{position:absolute;top:50%;left:50%;display:none;max-width:none;max-height:none;transform-origin:center;pointer-events:none}.hint{position:absolute;inset:0;display:grid;place-items:center;color:#bac2d5;text-align:center;padding:22px;pointer-events:none;white-space:pre-line}.status{font-size:12px;color:#c6cee0;max-width:360px;overflow-wrap:anywhere}.fullscreen .bar{display:none}.fullscreen .stage{height:100%}@media(max-width:650px){.brand{width:100%}.bar{gap:6px;padding:8px}.bar button,.bar select{font-size:12px;padding:8px}}
</style></head><body><main class="app" id="app"><header class="bar"><span class="brand">Captura Vertical</span><select id="devices" aria-label="Dispositivo de vídeo"><option value="">Câmera padrão</option></select><select id="profile" aria-label="Perfil de captura"><option value="fast">Rápido · 720p 60fps</option><option value="balanced">Equilibrado · 1080p 60fps</option><option value="quality">Nitidez · 1080p 30fps</option><option value="auto">Automático</option></select><button class="primary" id="start">Iniciar captura</button><button id="stop" disabled>Parar</button><button id="rotate">Girar 90°</button><button id="fit">Ajuste: conter</button><button id="full">Tela cheia</button><span class="status" id="metrics" aria-live="off"></span><span class="status" id="status" role="status" aria-live="polite">Aguardando</span></header><section class="stage" id="stage"><video id="video" autoplay muted playsinline disablepictureinpicture></video><div class="hint" id="hint">Conecte sua placa HDMI USB e clique em “Iniciar captura”.
Permita o acesso à câmera quando solicitado.</div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const video=$('video'),stage=$('stage'),status=$('status'),hint=$('hint'),deviceSelect=$('devices');
const storage={get(key,fallback){try{return localStorage.getItem(key)??fallback}catch{return fallback}},set(key,value){try{localStorage.setItem(key,String(value))}catch{}}};
let angle=Number(storage.get('rotation','0'));if(![0,90,180,270].includes(angle))angle=0;
let fit=storage.get('fit','contain');if(!['contain','cover'].includes(fit))fit='contain';
let stream=null,requestVersion=0,busy=false,resizeObserver=null;
const profiles={fast:{width:1280,height:720,frameRate:60},balanced:{width:1920,height:1080,frameRate:60},quality:{width:1920,height:1080,frameRate:30},auto:null};
const profileSelect=$('profile');let profile=storage.get('profile','fast');if(!(profile in profiles))profile='fast';profileSelect.value=profile;
let frameMonitorToken=0,frames=0,lastFrameTime=0,lastPaint=0;
function monitorFrames(){const token=++frameMonitorToken;frames=0;lastFrameTime=performance.now();lastPaint=0;if(!('requestVideoFrameCallback' in video))return;const onFrame=(now,metadata)=>{if(token!==frameMonitorToken||!stream)return;frames++;if(now-lastFrameTime>=1500){const fps=(frames*1000/(now-lastFrameTime)).toFixed(1);const dropped=typeof metadata.presentedFrames==='number'&&lastPaint?Math.max(0,metadata.presentedFrames-lastPaint-frames):null;$('metrics').textContent=`Exibição: ${fps} fps`+(dropped!==null?` · perdas estimadas: ${dropped}`:'');lastFrameTime=now;lastPaint=metadata.presentedFrames||0;frames=0}video.requestVideoFrameCallback(onFrame)};video.requestVideoFrameCallback(onFrame)}
function setStatus(message){status.textContent=message}
function setHint(message){hint.textContent=message;hint.hidden=false;hint.style.display='grid'}
function updateLabels(){$('rotate').textContent=`Girar 90° (${angle}°)`;$('fit').textContent=`Ajuste: ${fit==='contain'?'conter':'preencher'}`}
function updateControls(){$('start').disabled=busy;$('stop').disabled=!stream&&!busy}
function layout(){if(!video.videoWidth||!video.videoHeight||!stream)return;const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;const vw=video.videoWidth,vh=video.videoHeight,turned=angle%180!==0,ow=turned?vh:vw,oh=turned?vw:vh;const scale=(fit==='cover'?Math.max:Math.min)(w/ow,h/oh);video.style.width=`${vw*scale}px`;video.style.height=`${vh*scale}px`;video.style.transform=`translate(-50%, -50%) rotate(${angle}deg)`}
function releaseCurrent(){frameMonitorToken++;$('metrics').textContent='';if(stream){const old=stream;stream=null;for(const track of old.getTracks()){track.onended=null;track.stop()}}video.pause();video.srcObject=null;video.style.display='none'}
function stop(){requestVersion++;busy=false;releaseCurrent();updateControls();setStatus('Captura parada');setHint('Captura parada. Clique em “Iniciar captura” para continuar.')}
async function refreshDevices(){if(!navigator.mediaDevices?.enumerateDevices)return;try{const list=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const selected=deviceSelect.value;deviceSelect.replaceChildren();const fallback=document.createElement('option');fallback.value='';fallback.textContent='Câmera padrão';deviceSelect.append(fallback);for(const [i,d] of list.entries()){const opt=document.createElement('option');opt.value=d.deviceId;opt.textContent=d.label||`Dispositivo de vídeo ${i+1}`;deviceSelect.append(opt)}if(list.some(d=>d.deviceId===selected))deviceSelect.value=selected;else if(stream){const activeId=stream.getVideoTracks()[0]?.getSettings().deviceId;if(list.some(d=>d.deviceId===activeId))deviceSelect.value=activeId}}catch{setStatus('Não foi possível listar os dispositivos')}}
function errorMessage(e){switch(e?.name){case 'NotAllowedError':case 'PermissionDeniedError':return 'Permissão negada. Autorize o acesso à câmera nas configurações do navegador.';case 'NotFoundError':case 'DevicesNotFoundError':return 'Placa de captura não encontrada. Verifique a conexão USB.';case 'NotReadableError':case 'TrackStartError':return 'Dispositivo ocupado ou indisponível. Feche outros programas que usam a captura.';case 'OverconstrainedError':return 'Configuração de vídeo incompatível com a placa.';case 'SecurityError':return 'Acesso bloqueado. Abra o site por HTTPS ou localhost.';case 'AbortError':return 'A captura foi interrompida. Tente novamente.';default:return `Não foi possível iniciar a captura (${e?.name||'erro desconhecido'}).`}}
async function start(){if(busy)return;if(!navigator.mediaDevices?.getUserMedia){setHint('Acesso à câmera indisponível. Use HTTPS ou http://localhost.');setStatus('Navegador ou endereço incompatível');return}const version=++requestVersion;busy=true;updateControls();setStatus('Conectando…');const id=deviceSelect.value;releaseCurrent();let candidate=null;try{candidate=await navigator.mediaDevices.getUserMedia({video:{...(id?{deviceId:{exact:id}}:{}),...(profiles[profile]?{width:{ideal:profiles[profile].width},height:{ideal:profiles[profile].height},frameRate:{ideal:profiles[profile].frameRate}}:{})},audio:false});if(version!==requestVersion){candidate.getTracks().forEach(t=>t.stop());return}stream=candidate;candidate=null;video.srcObject=stream;await video.play();if(version!==requestVersion){releaseCurrent();return}video.style.display='block';hint.hidden=true;hint.style.display='none';const track=stream.getVideoTracks()[0],settings=track.getSettings();setStatus(`${video.videoWidth}×${video.videoHeight} • ${settings.frameRate||'?'} fps`);track.onended=()=>{if(stream?.getVideoTracks()[0]===track){releaseCurrent();updateControls();setStatus('Captura desconectada');setHint('A placa de captura foi desconectada. Reconecte e inicie novamente.')}};layout();monitorFrames();await refreshDevices()}catch(e){if(candidate)candidate.getTracks().forEach(t=>t.stop());if(version===requestVersion){releaseCurrent();setStatus('Falha na captura');setHint(errorMessage(e))}}finally{if(version===requestVersion){busy=false;updateControls()}}}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);deviceSelect.addEventListener('change',()=>{if(stream)start()});profileSelect.addEventListener('change',()=>{profile=profileSelect.value;storage.set('profile',profile);if(stream)start()});
$('rotate').addEventListener('click',()=>{angle=(angle+90)%360;storage.set('rotation',angle);updateLabels();layout()});$('fit').addEventListener('click',()=>{fit=fit==='contain'?'cover':'contain';storage.set('fit',fit);updateLabels();layout()});
$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen()}catch{setStatus('Tela cheia bloqueada pelo navegador')}});
document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('fullscreen',!!document.fullscreenElement);$('full').textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';layout()});
video.addEventListener('loadedmetadata',layout);window.addEventListener('resize',layout);if('ResizeObserver'in window){resizeObserver=new ResizeObserver(layout);resizeObserver.observe(stage)}
if(navigator.mediaDevices?.addEventListener)navigator.mediaDevices.addEventListener('devicechange',refreshDevices);
window.addEventListener('pagehide',()=>{requestVersion++;releaseCurrent()});
updateLabels();updateControls();if(navigator.mediaDevices?.enumerateDevices)refreshDevices();else setHint('Use um navegador atualizado e abra este site por HTTPS ou localhost.');
</script></body></html>
